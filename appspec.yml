version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/kaza-back-end
file_exists_behavior: OVERWRITE
hooks:
  BeforeInstall:
    - location: scripts/stop_services.sh
      timeout: 300
      runas: ubuntu
  ApplicationStart:
    - location: scripts/start_services.sh
      timeout: 300
      runas: ubuntu

