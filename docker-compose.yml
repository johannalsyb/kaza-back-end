name: kaza
services:
  db:
    image: mariadb:latest
    restart: unless-stopped
    volumes:
      - ./db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: kaza
      MYSQL_DATABASE: kaza
      MYSQL_USER: kaza
      MYSQL_PASSWORD: kaza

  directus:
    image: directus/directus:10.8.1
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: bengous@yopmail.com
      ADMIN_PASSWORD: abcDEF123!
      DB_CLIENT: mysql
      # DB_HOST: kazaswap.cx6yguoe2dhw.eu-west-3.rds.amazonaws.com
      DB_PORT: 3306
      # DB_DATABASE: kazaswap
      # DB_USER: admin
      # DB_PASSWORD: n8w9*gL*TlP7h%b5VCIBWw%&
      DB_HOST: db
      # DB_PORT: 3306
      DB_DATABASE: kaza
      DB_USER: kaza
      DB_PASSWORD: kaza
      DB_CHARSET: utf8mb4
      KEY: eWBcYgfq9i
      SECRET: v8qb9Bfyex
    volumes:
      # - ./directus/database:/directus/database
      - ./directus/uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
    ports:
      - '8065:8055'
    links:
      - 'db:db'

  redis:
    image: redis/redis-stack:latest
    restart: unless-stopped
    ports:
      - '7379:6379'
      - '7301:8001'
    # environment:
    volumes:
      - ./redis-data:/data
    # volumes:
      # - ./directus/database:/directus/database  
      # - 'db:db'
  
  nginx:
    image: nginx:alpine
    ports:
      - "7777:7777"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  verdaccio:
    image: verdaccio/verdaccio:latest
    restart: unless-stopped
    ports:
      - "4873:4873"
    volumes:
      # - ./verdaccio/conf:/verdaccio/conf
      - ./verdaccio/storage:/verdaccio/storage
      # - ./verdaccio/plugins:/verdaccio/plugins
  
  
