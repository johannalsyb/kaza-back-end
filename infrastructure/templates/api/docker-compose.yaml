version: "3.9"
services:
  api:
    network_mode: host
    logging:
      options:
        max-size: "150m"
        max-file: "3"
    image: ${KAZASWAP_API_IMAGE}
    restart: unless-stopped
    env_file:
      - env

  daemon:
    network_mode: host
    logging:
      options:
        max-size: "150m"
        max-file: "3"
    image: ${KAZASWAP_API_IMAGE}
    restart: unless-stopped
    env_file:
      - env
    environment:
      - DAEMON=true
      - API=false

  redis:
    network_mode: host
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    image: redis/redis-stack:latest
    restart: unless-stopped
    environment:
      - REDIS_ARGS=${REDIS_ARGS}
      - REDIS_STACK_DATABASE_PORT=${REDIS_PORT}

  nginx:
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    network_mode: host
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./htpasswd:/etc/nginx/.htpasswd