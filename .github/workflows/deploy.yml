name: Deploy to Staging

on:
  push:
    branches:
      - staging-kaza-api-directus

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_KEY }}
          script: |
            set -e
            set -x
            cd /home/ubuntu/kaza-back-end
            git fetch origin
            git checkout staging-kaza-api-directus || git checkout -b staging-kaza-api-directus origin/staging-kaza-api-directus
            git reset --hard origin/staging-kaza-api-directus
            docker-compose -f docker-compose.simple.yml down --remove-orphans
            docker system prune -f  #SAFE: no --volumes
            docker-compose -f docker-compose.simple.yml up -d --build --force-recreate
            docker-compose -f docker-compose.simple.yml exec -T app sh -c 'until nc -z db 3306; do echo "Waiting for DB..."; sleep 3; done'
            docker-compose -f docker-compose.simple.yml exec -T app npx directus database migrate:latest || (echo "Migration failed" && exit 1)
            docker-compose -f docker-compose.simple.yml exec -T app npx directus database migrate:latest || (echo "Directus migration failed" && exit 1)
            docker-compose -f docker-compose.simple.yml exec -T app npx knex migrate:latest --knexfile ./knexfile.js || (echo "Knex migration failed" && exit 1)
            


